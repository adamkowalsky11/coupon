name: coupon-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coupon
      POSTGRES_USER: coupon
      POSTGRES_PASSWORD: coupon
    ports:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon -d coupon"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
